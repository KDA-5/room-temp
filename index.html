<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="익-커 — KDA 5기 익명 커뮤니티. 강의실 온도를 익명으로 정하는 곳. 3초면 끝납니다.">
<meta name="theme-color" content="#f5f6f8">
<title>익-커 · 강의실 온도</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>

<div class="app">

  <header class="top">
    <div class="brand">
      <h1 id="title">강의실 온도</h1>
      <span class="crew"><b>익-커</b>KDA 5기</span>
    </div>
    <div class="topmeta">
      <span class="chip" id="peerChip" hidden>● <b>0</b>명</span>
      <span class="chip" id="clockChip">--:--</span>
    </div>
  </header>

  <main class="main" id="main">

    <!-- ── 온도 탭 ─────────────────────────────── -->
    <section class="view" id="viewTemp">

      <div class="hero" id="hero">
        <div class="herotwo">
          <div class="hcol">
            <div class="hlab">지금 실내 온도</div>
            <div class="hval" id="nowTemp">–<i>°</i></div>
          </div>
          <div class="harrow" id="heroArrow">→</div>
          <div class="hcol want">
            <div class="hlab">학생들이 원하는 온도</div>
            <div class="hval" id="setpoint">–<i>°</i></div>
          </div>
        </div>
        <div class="heroact" id="heroAct">표가 모이면 정해집니다</div>
        <div class="heroout" id="heroOut" hidden></div>
      </div>

      <button class="nowbar" id="nowBar" type="button" aria-label="다음 잡학"></button>

      <div class="block">
        <div class="blockhead"><h2>지금 어때요?</h2><span class="sub" id="feelSub"></span></div>
        <div class="three" id="feelRow">
          <button type="button" data-feel="-1"><em>🥶</em><b>추워요</b><i>+1°</i></button>
          <button type="button" data-feel="0"><em>👌</em><b>딱 좋아요</b><i>지금 그대로</i></button>
          <button type="button" data-feel="1"><em>🥵</em><b>더워요</b><i>−1°</i></button>
        </div>

        <button class="myrow" id="myRow" type="button" aria-expanded="false">
          <span class="mylab">내 희망 온도</span>
          <span class="myval" id="myVal">–</span>
          <span class="mychev">직접 고르기 <i class="cv">▾</i></span>
        </button>
        <div class="barwrap" id="barWrap" hidden>
          <svg id="tempBar" viewBox="0 0 640 126" role="group" aria-label="희망 온도 고르기"></svg>
        </div>
      </div>

      <div class="block">
        <div class="blockhead"><h2>내 자리</h2><span class="sub">바람 배분에 쓰입니다</span></div>
        <div class="seats" id="seats"></div>
      </div>

      <div class="block flow" id="flowBlock">
        <div class="blockhead"><h2>🌬️ 바람 배분</h2></div>
        <div class="flowtext" id="flowText"></div>
      </div>

      <div class="block leave" id="leaveBlock" hidden>
        <div class="blockhead"><h2>🏠 오늘 끝</h2></div>
        <p class="leavetext" id="leaveText"></p>
        <button class="leavebtn" id="leaveBtn" type="button">퇴실하기</button>
      </div>
    </section>

    <!-- ── 강의 탭 ─────────────────────────────── -->
    <section class="view" id="viewLecture" hidden>
      <p class="note" id="lecNote"></p>

      <div class="block">
        <div class="blockhead"><h2>난이도</h2><span class="sub" id="diffSub"></span></div>
        <div class="five" id="diffRow"></div>
        <div id="diffVerdict"></div>
      </div>

      <div class="block">
        <div class="blockhead"><h2>속도</h2><span class="sub" id="paceSub"></span></div>
        <div class="five" id="paceRow"></div>
        <div id="paceVerdict"></div>
      </div>

      <p class="tip" id="lecTip" hidden></p>
    </section>

    <!-- ── 익명 채팅 탭 ────────────────────────── -->
    <section class="view" id="viewChat" hidden></section>

    <!-- ── 더보기 탭 ───────────────────────────── -->
    <section class="view" id="viewMore" hidden>
      <div class="menu" id="moreMenu"></div>
      <div class="sheet" id="sheet" hidden>
        <div class="sheethead">
          <button class="back" id="sheetBack" type="button">‹ 뒤로</button>
          <h2 id="sheetTitle"></h2>
        </div>
        <div class="sheetbody" id="sheetBody"></div>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="temp" aria-selected="true"><em>🌡️</em>온도</button>
    <button type="button" data-tab="lecture" aria-selected="false"><em>🎓</em>강의</button>
    <button type="button" data-tab="chat" aria-selected="false"><em>🗨️</em>익명 채팅<i class="badge" id="cBadge" hidden></i></button>
    <button type="button" data-tab="more" aria-selected="false"><em>⋯</em>더보기<i class="badge" id="qBadge" hidden></i></button>
  </nav>

  <div class="toast" id="toast" hidden></div>
  <div class="boot" id="boot"><span>여는 중…</span></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
