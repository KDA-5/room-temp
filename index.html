<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="강의실 온도를 익명으로 정하는 곳. 3초면 끝납니다.">
<meta name="theme-color" content="#f5f6f8">
<title>강의실 온도</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
</head>
<body>

<div class="app">

  <header class="top">
    <h1>강의실 온도</h1>
    <div class="topmeta">
      <span class="chip" id="peerChip" hidden>● <b>0</b>명</span>
      <span class="chip" id="clockChip">--:--</span>
    </div>
  </header>

  <main class="main" id="main">

    <!-- ── 온도 탭 ─────────────────────────────── -->
    <section class="view" id="viewTemp">

      <div class="hero" id="hero">
        <div class="herolab">지금 맞춰야 할 온도</div>
        <div class="herobig"><span id="setpoint">–</span><span class="deg">°C</span></div>
        <div class="heroact" id="heroAct">표가 모이면 정해집니다</div>
      </div>

      <div class="block">
        <div class="blockhead"><h2>지금 어때요?</h2><span class="sub" id="feelSub"></span></div>
        <div class="three" id="feelRow">
          <button type="button" data-feel="-1"><em>🥶</em><b>추워요</b><i>+0.5°</i></button>
          <button type="button" data-feel="0"><em>👌</em><b>딱 좋아요</b><i>지금 그대로</i></button>
          <button type="button" data-feel="1"><em>🥵</em><b>더워요</b><i>−0.5°</i></button>
        </div>

        <button class="myrow" id="myRow" type="button" aria-expanded="false">
          <span class="mylab">내 희망 온도</span>
          <span class="myval" id="myVal">–</span>
          <span class="mychev">직접 고르기 ▾</span>
        </button>
        <div class="barwrap" id="barWrap" hidden>
          <svg id="tempBar" viewBox="0 0 640 96" role="group" aria-label="희망 온도 고르기"></svg>
        </div>
      </div>

      <div class="block">
        <div class="blockhead"><h2>내 자리</h2><span class="sub">바람 배분에 쓰입니다</span></div>
        <div class="seats" id="seats"></div>
      </div>

      <div class="block flow" id="flowBlock">
        <div class="blockhead"><h2>🌬️ 바람 배분</h2></div>
        <div class="flowtext" id="flowText"></div>
      </div>
    </section>

    <!-- ── 강의 탭 ─────────────────────────────── -->
    <section class="view" id="viewLecture" hidden>
      <p class="note" id="lecNote"></p>

      <div class="block">
        <div class="blockhead"><h2>난이도</h2></div>
        <div class="five" id="diffRow">
          <button type="button" data-diff="-2"><em>🥱</em>너무<br>쉬움</button>
          <button type="button" data-diff="-1"><em>🙂</em>좀<br>쉬움</button>
          <button type="button" data-diff="0"><em>👌</em>딱<br>좋음</button>
          <button type="button" data-diff="1"><em>😵‍💫</em>좀<br>어려움</button>
          <button type="button" data-diff="2"><em>🆘</em>너무<br>어려움</button>
        </div>
        <div id="diffVerdict"></div>
      </div>

      <div class="block">
        <div class="blockhead"><h2>속도</h2></div>
        <div class="five" id="paceRow">
          <button type="button" data-pace="-2"><em>🐢</em>너무<br>느림</button>
          <button type="button" data-pace="-1"><em>🚶</em>좀<br>느림</button>
          <button type="button" data-pace="0"><em>👌</em>딱<br>좋음</button>
          <button type="button" data-pace="1"><em>🏃</em>좀<br>빠름</button>
          <button type="button" data-pace="2"><em>🚀</em>너무<br>빠름</button>
        </div>
        <div id="paceVerdict"></div>
      </div>

      <p class="tip" id="lecTip" hidden></p>
    </section>

    <!-- ── 더보기 탭 ───────────────────────────── -->
    <section class="view" id="viewMore" hidden>
      <div class="menu" id="moreMenu"></div>
      <div class="sheet" id="sheet" hidden>
        <div class="sheethead">
          <button class="back" id="sheetBack" type="button">‹ 뒤로</button>
          <h2 id="sheetTitle"></h2>
        </div>
        <div class="sheetbody" id="sheetBody"></div>
      </div>
    </section>
  </main>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="temp" aria-selected="true"><em>🌡️</em>온도</button>
    <button type="button" data-tab="lecture" aria-selected="false"><em>🎓</em>강의</button>
    <button type="button" data-tab="more" aria-selected="false"><em>⋯</em>더보기<i class="badge" id="qBadge" hidden></i></button>
  </nav>

  <div class="toast" id="toast" hidden></div>
  <div class="boot" id="boot"><span>여는 중…</span></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
